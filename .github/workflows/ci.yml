name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      # The bundled binaries aren't in git; the analyzer only needs their folders to exist.
      - run: mkdir -p assets/bin/linux assets/bin/windows assets/bin/macos
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
