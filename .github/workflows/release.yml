name: Release

# Push a tag like v0.2.0 to build Android, Linux, Windows and macOS and attach them to a GitHub release.
# "Run workflow" (manual) builds everything and keeps the files as workflow artifacts without making a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::Release builds need the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (see README). Refusing to publish debug-signed APKs."
              exit 1
            fi
            echo "::warning::No signing secrets: this APK is signed with the debug key and is only good for testing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-tunes404}"
          } > android/key.properties
      - run: bash tool/fetch_binaries.sh
      - name: Version from the tag
        shell: bash
        run: bash tool/ci_version.sh >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi $VERSION_ARGS
      - name: Show signer
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for a in build/app/outputs/flutter-apk/*-release.apk; do
            echo "$a"; "$BT/apksigner" verify --print-certs "$a" | grep -E "certificate (DN|SHA-256)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/*-release.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv libasound2-dev libsqlite3-dev
      - run: bash tool/fetch_binaries.sh
      - name: Version from the tag
        shell: bash
        run: bash tool/ci_version.sh >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }} $VERSION_ARGS
      - run: tar -czf 404tunes-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: 404tunes-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/fetch_binaries.sh
        shell: bash
      - name: Version from the tag
        shell: bash
        run: bash tool/ci_version.sh >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }} $VERSION_ARGS
        shell: bash
      - name: Bundle the Visual C++ runtime
        # Without these DLLs next to the exe, a PC that never installed the VC++ redistributable can't start the app.
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$d" build/windows/x64/runner/Release/
          }
      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath 404tunes-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\build\windows\x64\runner\Release" windows\installer\404tunes.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Move-Item dist/404tunes-windows-x64-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            404tunes-windows-x64.zip
            404tunes-windows-x64-setup.exe

  macos:
    runs-on: macos-latest # Apple silicon: matches the arm64 quickjs that tool/fetch_binaries.sh bundles
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/fetch_binaries.sh
      - name: Version from the tag
        shell: bash
        run: bash tool/ci_version.sh >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }} $VERSION_ARGS
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/tunes404.app 404tunes-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: 404tunes-macos-arm64.zip

  release:
    if: github.ref_type == 'tag'
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Signed update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash tool/sign_update.sh dist "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "404 Tunes $GITHUB_REF_NAME" --generate-notes
          fi
