name: tunes404
description: 404 Tunes - a fully local music player for Android and desktop, powered by yt-dlp.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  ffi: ^2.2.0
  just_audio_media_kit: ^2.0.5
  media_kit_libs_linux: any
  media_kit_libs_windows_audio: any
  media_kit_libs_macos_audio: any
  audio_service: ^0.18.15
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  cryptography: ^2.7.0
  cached_network_image: ^4.0.7
  http: ^1.2.2
  file_picker: ^13.4.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Each platform bundles only its own yt-dlp + quickjs (Android gets quickjs through jniLibs/).
    - assets/branding/logo.png
    - path: assets/bin/linux/
      platforms: [linux]
    - path: assets/bin/windows/
      platforms: [windows]
    - path: assets/bin/macos/
      platforms: [macos]
